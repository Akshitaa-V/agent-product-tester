<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Practice{% endblock %} - Practice app</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1d2433; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #dde; margin-bottom: 1.5rem; }
    .error { background: #fde8e8; border: 1px solid #f5b5b5; padding: .6rem .8rem; border-radius: 6px; }
    .card { border: 1px solid #dde; border-radius: 8px; padding: 1rem; margin: .8rem 0; }
    button, .button { background: #2f5bea; color: white; border: 0; border-radius: 6px; padding: .5rem .9rem; cursor: pointer; text-decoration: none; }
    button.secondary { background: #eef; color: #2f5bea; }
    textarea { width: 100%; min-height: 9rem; }
    progress { width: 100%; height: 1rem; }
  </style>
</head>
<body>
  <header><strong>Practice app</strong>{% block nav %}{% endblock %}</header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
