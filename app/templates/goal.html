{% extends "base.html" %}
{% block title %}Weekly goal{% endblock %}
{% block content %}
<h1>Weekly practice goal</h1>
<p>How many practice sessions do you want to finish each week? Pick a number from {{ lo }} to {{ hi }}.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/goal">
  <label for="spw">Sessions per week</label>
  <input id="spw" name="sessions_per_week" type="text" inputmode="numeric" value="{{ value }}">
  <button type="submit">Save goal</button>
</form>
<p><a href="/dashboard">Back to dashboard</a></p>
{% endblock %}
