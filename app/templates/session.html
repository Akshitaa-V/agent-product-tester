{% extends "base.html" %}
{% block title %}{{ s.title }}{% endblock %}
{% block content %}
<h1>{{ s.title }}</h1>
<p>{{ s.prompt }}</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/sessions/{{ s.session_id }}/submit">
  <label for="answer">Your answer</label>
  <textarea id="answer" name="answer">{{ answer }}</textarea>
  <button type="submit">Submit answer</button>
</form>
<form method="post" action="/sessions/{{ s.session_id }}/abandon">
  <button type="submit" class="secondary">Leave session</button>
</form>
{% endblock %}
